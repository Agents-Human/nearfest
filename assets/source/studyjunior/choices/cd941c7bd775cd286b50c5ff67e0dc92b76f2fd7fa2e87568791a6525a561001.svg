    @keyframes toy-jelly  { 0%,100% { transform: scale(1,1); }           30% { transform: scale(1.08,0.92); } 60% { transform: scale(0.95,1.05); } }
    @keyframes toy-bob    { 0%,100% { transform: translateY(3%) scale(1.015,0.985); } 50% { transform: translateY(-8%) scale(0.985,1.015); } }
    @keyframes toy-wobble { 0%,100% { transform: rotate(-6deg); }        50% { transform: rotate(6deg); } }
    @keyframes toy-swing  { 0%,100% { transform: rotate(-5deg); }        50% { transform: rotate(5deg); } }
    @keyframes toy-tilt   { 0%,100% { transform: rotate(-5deg) scale(0.97); } 50% { transform: rotate(5deg) scale(1.05); } }
    @media (prefers-reduced-motion: reduce) { .toy-anim { animation: none !important; } }
  </style>
