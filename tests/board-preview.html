<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>3D table playtest</title><style>body{margin:0;background:#dcd5c1;color:#30483e;font:13px system-ui}header{display:flex;gap:10px;align-items:center;padding:12px}button,select{font:inherit;padding:8px}main{max-width:1000px;margin:0 auto;padding:0 16px}canvas{display:block}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}</style><div id="root"></div><script type="module">
