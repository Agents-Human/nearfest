<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Action world playtest</title><style>body{margin:0;background:#142b32;color:#e8f0e0;font:13px system-ui}header{display:flex;gap:12px;align-items:center;padding:12px;flex-wrap:wrap}select,button{font:inherit;padding:8px;background:#e9efde;color:#14353c;border:0;border-radius:5px}#world{height:calc(100vh - 100px);min-height:250px}footer{padding:10px;color:#a5c7c0}#metrics{margin-left:auto}canvas{display:block;width:100%;height:100%}</style><header><b>Action world playtest</b><select aria-label="Preview game" id="game"></select><button id="pause">Pause simulation</button><button id="restart">Restart</button><button id="camera">Change camera</button><span id="metrics"></span></header><div id="world"></div><footer id="status">Loading…</footer><script type="module">
// Manual development harness. Imports production rendering and authoritative
// simulation directly; no copied game code or network/wallet side effects.
import {WorldRenderer} from '/src/games/world-renderer.ts';
import {newWorld,advanceWorld,worldBot,worldAction,worldIds} from '/server/arcade/world.mjs';
const select=document.querySelector('#game'),host=document.querySelector('#world'),status=document.querySelector('#status'),metric=document.querySelector('#metrics');
for(const id of worldIds){const o=document.createElement('option');o.value=id;o.textContent=id;select.append(o);}
let engine,state,paused=false,mode='follow',generation=0;
async function start(){const current=++generation;engine?.dispose();engine=null;state=newWorld(select.value,['snake-arena','marble-knockout'].includes(select.value)?4:2);const assets=await WorldRenderer.prepare(select.value);if(current!==generation)return;engine=new WorldRenderer(host,state,0,m=>{metric.textContent=`${m.fps} FPS · ${m.drawCalls} draws · ${m.triangles.toLocaleString()} triangles`;},assets);engine.setAim(0,.65);paused=false;document.querySelector('#pause').textContent='Pause simulation';}
select.addEventListener('change',start);document.querySelector('#restart').addEventListener('click',start);document.querySelector('#camera').addEventListener('click',()=>{mode=mode==='follow'?'overview':'follow';engine.setCamera(mode);});document.querySelector('#pause').addEventListener('click',e=>{paused=!paused;e.target.textContent=paused?'Resume simulation':'Pause simulation';});
setInterval(()=>{if(!state||!engine||paused)return;const held=state.players.map((_,i)=>worldBot(state,i));state=advanceWorld(state,held);if(state.game==='mini-golf'&&!state.moving&&!state.finished)worldAction(state,state.turn,{type:'shoot',angle:0,power:.65});engine.push(state,0);status.textContent=`${state.game} · ${state.elapsed.toFixed(1)}s · ${state.finished?state.reason:'Playing'} · player 1 coins: ${state.players[0].coins||0}`;},50);
start();
</script></html>
